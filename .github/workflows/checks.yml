name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-doc-links.mjs
      - run: node scripts/prepare-ui-tests.mjs
      - run: npm ci && npm run build && npm audit --audit-level=high
        working-directory: web
      - run: go test ./config ./internal/... ./mobile
      - run: go vet ./config ./internal/... ./cmd/signaling ./mobile
      - run: go test -tags noai ./internal/app -run TestNoAI -count=1
      - name: Build isolated UI backends
        run: |
          mkdir -p .build dist
          CGO_ENABLED=0 go build -o .build/signaling-test.exe ./cmd/signaling
          CGO_ENABLED=0 go build -o .build/preferans-test.exe ./cmd/preferans
          CGO_ENABLED=0 go build -tags noai -o dist/Preferans-NoAI.exe ./cmd/preferans
      - name: Build public-default backend
        run: |
          printf '{}' > config/local/build.json
          cd web
          npm run build
          cd ..
          CGO_ENABLED=0 go build -tags noai -o .build/preferans-public-test.exe ./cmd/preferans
          node scripts/prepare-ui-tests.mjs
          cd web
          npm run build
      - name: Install browser and run UI tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          export CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')
          npm test
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # GO-2024-3218 (цензура контента через записи провайдеров в Kademlia DHT, исправления нет): приложение
      # использует DHT только как клиент поиска узлов для relay и не публикует и не ищет записи провайдеров.
      # Все остальные уязвимости по-прежнему роняют проверку.
      - name: govulncheck
        run: |
          govulncheck -format json ./config ./internal/... ./cmd/signaling ./mobile > vuln.json
          found=$(jq -r 'select(.finding.trace[0].function != null) | .finding.osv' vuln.json | sort -u | grep -v -x 'GO-2024-3218' || true)
          if [ -n "$found" ]; then
            echo "Найдены уязвимости: $found"
            govulncheck ./config ./internal/... ./cmd/signaling ./mobile || true
            exit 1
          fi
          echo "Уязвимостей кроме принятой GO-2024-3218 нет."
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --redact --log-opts=--all .
